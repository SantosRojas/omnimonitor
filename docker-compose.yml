# =============================================================================
#  omni-pdms-v2 — Docker Compose (production, Docker + Podman compatible)
# =============================================================================
#
#  Services:
#    postgres — PostgreSQL 16 database
#    server   — Rust axum backend (REST + WebSocket) serving the built SPA
#
#  Quick start:
#    1. Copy .env.example → .env and fill in secrets
#    2. docker compose up -d
#    3. curl http://localhost:9001/health
#
#  Sin código fuente (imagen precompilada):
#    docker load -i omni-pdms-server.tar
#    docker compose up -d
#    (el tag fijo `omni-pdms-server:latest` evita que Compose intente compilar)
#
#  Frontend:
#    The SPA is built INSIDE the Dockerfile (frontend-build stage) and baked
#    into the runtime image at /app/frontend/dist — no separate build step or
#    mount needed. In development you may override the SPA with a mounted
#    dist directory:
#      volumes:
#        - ./frontend/dist:/app/frontend/dist
#
#  Podman:
#    No `condition: service_healthy` is used, so the same compose file also
#    works with podman-compose and podman compose.
#
# =============================================================================

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_DATABASE:-omni_pdms}
      POSTGRES_USER: ${DB_USERNAME:-omni_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-<change-this>}

  # ── Server (Axum backend) ──────────────────────────────────────────────────
  server:
    build: .
    # Imagen FIJA: `docker load -i omni-pdms-server.tar` + `docker compose up -d`
    # funcionan en CUALQUIER carpeta (no depende del nombre del directorio).
    # En desarrollo `docker compose build` produce el mismo tag.
    image: omni-pdms-server:latest
    restart: unless-stopped
    ports:
      - "${PORT:-9001}:${PORT:-9001}"
    depends_on:
      - postgres
    environment:
      PORT: ${PORT:-9001}
      # DB_HOST/DB_PORT are FIXED to the compose service name: inside the
      # compose network the database is always reachable as `postgres:5432`.
      # Reading them from .env would let a native-dev DB_HOST=localhost leak
      # into the container and break startup with a silent DB retry loop.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-omni_pdms}
      DB_USERNAME: ${DB_USERNAME:-omni_user}
      DB_PASSWORD: ${DB_PASSWORD:-<change-this>}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:9001}
      FRONTEND_DIST: ${FRONTEND_DIST:-/app/frontend/dist}
      SEED_LANG: ${SEED_LANG:-es}
      SEED_REFRESH: ${SEED_REFRESH:-false}

volumes:
  pgdata:
